name: jinka-test

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test Jinka
        env:
          JINKA_ACCESS_TOKEN: ${{ secrets.JINKA_ACCESS_TOKEN }}
        run: python jinka_test.py
