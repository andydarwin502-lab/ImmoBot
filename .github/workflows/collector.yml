name: collector

# Collecte : Jinka -> ta base Supabase -> note IA.
# Tourne toutes les 20 min + bouton "Run workflow".

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collecte
        env:
          JINKA_ACCESS_TOKEN: ${{ secrets.JINKA_ACCESS_TOKEN }}
          SUPABASE_URL: "https://hbugmlasvnolojexywtz.supabase.co"
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.0-flash
        run: python collector.py
